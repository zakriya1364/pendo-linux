name: Pendo preflight and RPM build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  preflight:
    name: Static validation (Fedora 44)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          dnf -y install pykickstart shellcheck rpm-build createrepo_c tar python3 git systemd-rpm-macros
      - name: Run preflight
        run: |
          chmod +x build/*.sh
          mkdir -p build/logs
          set -o pipefail
          PENDO_FEDORA=44 ./build/preflight.sh 2>&1 | tee build/logs/preflight.log
      - name: Upload preflight log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-failure-log
          path: build/logs/preflight.log
      - name: Build pendo-defaults RPM
        run: |
          mkdir -p build/logs
          set -o pipefail
          ./build/build-rpm.sh 2>&1 | tee build/logs/rpm-build.log
      - name: Upload RPM build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpm-build-failure-log
          path: build/logs/rpm-build.log
      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: pendo-defaults-rpm
          path: build/repo/*.rpm

  iso:
    name: Build live ISO (manual, Fedora host required)
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO build tools
        run: |
          dnf -y install lorax-lmc-novirt pykickstart git rpm-build createrepo_c systemd-rpm-macros
      - name: Run preflight
        run: PENDO_CONFIRM=yes PENDO_FEDORA=44 ./build/preflight.sh
      - name: Build ISO
        run: |
          mkdir -p build/logs
          set -o pipefail
          PENDO_CONFIRM=yes PENDO_FEDORA=44 ./build/build-iso.sh 2>&1 | tee build/logs/iso-build.log
      - name: Publish ISO build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
import os, json, urllib.request
token = os.environ.get("GITHUB_TOKEN","")
repo = os.environ.get("GITHUB_REPOSITORY","")
try:
    log = open("build/logs/iso-build.log").read()
except Exception as e:
    log = "could not read log: " + str(e)
if len(log) > 60000:
    log = log[-60000:]
data = {"title": "ISO build failure log", "body": "```\n" + log + "\n```"}
req = urllib.request.Request(
    "https://api.github.com/repos/" + repo + "/issues",
    data=json.dumps(data).encode(),
    headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
try:
    with urllib.request.urlopen(req) as r:
        print(r.read().decode())
except Exception as e:
    print("ISSUE_CREATE_FAILED:", e)
'
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pendo-linux-iso
          path: |
            build/out/**/*.iso
            build/out/**/*.sha256
            build/logs/*.log
