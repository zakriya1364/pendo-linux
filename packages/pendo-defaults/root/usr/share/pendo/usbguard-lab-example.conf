# EXAMPLE ONLY - not active. Copy to /etc/usbguard/rules.conf and enable
# usbguard.service only after testing on your hardware.
# Allows: audio(01), printers(07), HID(03), hubs(09), video(0e), wireless(e0).
# Blocks: mass storage and everything else (this also stops USB content packs).
allow with-interface one-of { 01:*:* 03:*:* 07:*:* 09:*:* 0e:*:* e0:*:* }
block
