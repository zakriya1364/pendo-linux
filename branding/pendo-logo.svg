<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <defs>
    <linearGradient id="pendoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6B5FFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8844;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5733;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="512" cy="512" r="512" fill="url(#pendoGradient)" opacity="0.95"/>

  <!-- Outer geometric accent (Zorin-style ring) -->
  <circle cx="512" cy="512" r="480" fill="none" stroke="url(#accentGradient)" stroke-width="8" opacity="0.6"/>
  <circle cx="512" cy="512" r="430" fill="none" stroke="url(#accentGradient)" stroke-width="4" opacity="0.3"/>

  <!-- Penguin Head (stylized geometric) -->
  <g transform="translate(512, 380)">
    <!-- Head circle -->
    <circle cx="0" cy="0" r="140" fill="#ffffff" opacity="0.95"/>
    
    <!-- Eyes -->
    <circle cx="-45" cy="-30" r="20" fill="#1a1a1a"/>
    <circle cx="45" cy="-30" r="20" fill="#1a1a1a"/>
    
    <!-- Eye shine -->
    <circle cx="-42" cy="-32" r="7" fill="#ffffff"/>
    <circle cx="48" cy="-32" r="7" fill="#ffffff"/>
    
    <!-- Beak -->
    <path d="M -15 15 L 15 15 L 0 35 Z" fill="#FF8844"/>
    
    <!-- Head accent stripes (Zorin geometric style) -->
    <path d="M -140 -70 Q -120 -80 -100 -70" stroke="url(#accentGradient)" stroke-width="6" fill="none" opacity="0.7"/>
    <path d="M 100 -70 Q 120 -80 140 -70" stroke="url(#accentGradient)" stroke-width="6" fill="none" opacity="0.7"/>
  </g>

  <!-- Penguin Body (geometric segments) -->
  <g transform="translate(512, 480)">
    <!-- Main body -->
    <ellipse cx="0" cy="0" rx="110" ry="160" fill="#1a1a1a"/>
    
    <!-- Belly -->
    <ellipse cx="0" cy="20" rx="70" ry="120" fill="#ffffff" opacity="0.85"/>
    
    <!-- Wing left -->
    <path d="M -70 -40 Q -130 -60 -140 20 Q -130 40 -80 30 Z" fill="#1a1a1a"/>
    
    <!-- Wing right -->
    <path d="M 70 -40 Q 130 -60 140 20 Q 130 40 80 30 Z" fill="#1a1a1a"/>
    
    <!-- Foot left -->
    <ellipse cx="-35" cy="155" rx="25" ry="40" fill="#FF8844"/>
    
    <!-- Foot right -->
    <ellipse cx="35" cy="155" rx="25" ry="40" fill="#FF8844"/>
    
    <!-- Body accent stripes (Zorin style) -->
    <path d="M -50 -80 L -40 80" stroke="url(#accentGradient)" stroke-width="8" opacity="0.4"/>
    <path d="M 50 -80 L 40 80" stroke="url(#accentGradient)" stroke-width="8" opacity="0.4"/>
  </g>

  <!-- Geometric accent triangles (Zorin corners) -->
  <path d="M 50 50 L 150 50 L 100 130 Z" fill="url(#accentGradient)" opacity="0.6" transform="rotate(0 100 100)"/>
  <path d="M 974 50 L 874 50 L 924 130 Z" fill="url(#accentGradient)" opacity="0.6" transform="rotate(90 924 100)"/>
  <path d="M 50 974 L 150 974 L 100 894 Z" fill="url(#accentGradient)" opacity="0.6" transform="rotate(-90 100 924)"/>
  <path d="M 974 974 L 874 974 L 924 894 Z" fill="url(#accentGradient)" opacity="0.6" transform="rotate(180 924 924)"/>

  <!-- "PENDO" Text Styling (text removed, icon-only logo) -->
  <!-- For icon use, this is the pure symbol. Text can be added elsewhere -->
</svg>
